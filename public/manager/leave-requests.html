<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave requests &middot; HR Management System</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/chat.js"></script>
  <script>

const user = requireRole('manager', 'admin');
if (user) start();

function start() {
  const main = ui.layout(user, '/manager/leave-requests.html');
  main.innerHTML = ui.head('Leave requests', 'Requests from the departments you manage') + `
    <div class="card">
      <div class="card-head">
        <h2>Requests</h2>
        <select id="filter" style="width:auto">
          <option value="Pending" selected>Pending</option>
          <option value="">All statuses</option>
          <option>Approved</option><option>Rejected</option><option>Cancelled</option>
        </select>
      </div>
      <div id="list" class="loading">Loading...</div>
    </div>`;
  document.getElementById('filter').onchange = load;
  load();
}

async function load() {
  const list = document.getElementById('list');
  const status = document.getElementById('filter').value;
  list.className = 'loading';
  list.textContent = 'Loading...';

  try {
    const result = await api.get('/api/manager/leave-requests?limit=50' + (status ? '&status=' + status : ''));
    list.className = '';
    list.innerHTML = ui.table(
      ['Employee', 'Department', 'Dates', 'Days', 'Reason', 'Status', ''],
      result.data.map(r => [
        '<a href="/manager/employee.html?id=' + r.employee_id + '">' + ui.name(r) + '</a>',
        ui.escape(r.department_name || '-'),
        ui.range(r.start_date, r.end_date),
        '<span class="num">' + r.total_days + '</span>',
        ui.escape(r.user_comment || '-'),
        ui.badge(r.status),
        r.status === 'Pending'
          ? '<div class="btn-row">' +
              '<button class="btn small" onclick="approve(' + r.id + ')">Approve</button>' +
              '<button class="btn small danger" onclick="reject(' + r.id + ')">Reject</button>' +
            '</div>'
          : (r.reviewer_first_name ? ui.escape('by ' + r.reviewer_first_name) : ''),
      ]),
      'No requests with that status.'
    );
  } catch (err) {
    list.className = '';
    list.innerHTML = ui.alert(err.message, 'error');
  }
}

async function approve(id) {
  try {
    await api.patch('/api/manager/leave-requests/' + id + '/approve', { comment: null });
    ui.toast('Request approved. The balance has been updated.', 'ok');
    load();
  } catch (err) {
    ui.toast(err.message, 'error');
  }
}

function reject(id) {
  ui.modal('Reject this request', `
    <div class="field">
      <label for="reason">Reason (the employee will see this)</label>
      <textarea id="reason" name="reason" required maxlength="500"></textarea>
    </div>`, async (form) => {
    await api.patch('/api/manager/leave-requests/' + id + '/reject', { reason: form.get('reason') });
    ui.toast('Request rejected.', 'ok');
    load();
  });
}

  </script>
</body>
</html>
