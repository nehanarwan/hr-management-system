<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Approval history &middot; HR Management System</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/chat.js"></script>
  <script>

const user = requireRole('manager', 'admin');
if (user) start();

async function start() {
  const main = ui.layout(user, '/manager/approval-history.html');
  main.innerHTML = ui.head('Approval history', 'Every decision made on your departments’ requests') +
    '<div class="card"><div id="list" class="loading">Loading...</div></div>';

  try {
    const result = await api.get('/api/manager/approval-history?limit=50');
    const list = document.getElementById('list');
    list.className = '';
    list.innerHTML = ui.table(
      ['Decided', 'Employee', 'Department', 'Leave dates', 'Days', 'Decision', 'Comment', 'Decided by'],
      result.data.map(r => [
        ui.date(r.created_at),
        ui.name(r),
        ui.escape(r.department_name || '-'),
        ui.range(r.start_date, r.end_date),
        '<span class="num">' + r.total_days + '</span>',
        ui.badge(r.status),
        ui.escape(r.head_comment || '-'),
        r.reviewer_first_name ? ui.escape(r.reviewer_first_name + ' ' + r.reviewer_last_name) : '-',
      ]),
      'No decisions have been recorded yet.'
    );
  } catch (err) {
    document.getElementById('list').innerHTML = ui.alert(err.message, 'error');
  }
}

  </script>
</body>
</html>
