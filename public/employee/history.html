<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave history &middot; HR Management System</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/chat.js"></script>
  <script>

const user = requireRole('employee', 'manager', 'admin');
if (user) start();

async function start() {
  const main = ui.layout(user, '/employee/history.html');
  main.innerHTML = ui.head('My leave history', 'Every request you have made, and what happened to it',
    '<a class="btn" href="/employee/request.html">Request leave</a>') + `
    <div class="card">
      <div class="card-head">
        <h2>Requests</h2>
        <select id="filter" style="width:auto">
          <option value="">All statuses</option>
          <option>Pending</option><option>Approved</option><option>Rejected</option><option>Cancelled</option>
        </select>
      </div>
      <div id="list" class="loading">Loading...</div>
    </div>`;

  if (new URLSearchParams(location.search).get('submitted')) {
    ui.toast('Your leave request was submitted and is waiting for a decision.', 'ok');
  }

  document.getElementById('filter').onchange = load;
  load();
}

async function load() {
  const list = document.getElementById('list');
  const status = document.getElementById('filter').value;
  list.className = 'loading';
  list.textContent = 'Loading...';

  try {
    const result = await api.get('/api/leave/requests?limit=50' + (status ? '&status=' + status : ''));
    list.className = '';
    list.innerHTML = ui.table(
      ['Dates', 'Days', 'Reason', 'Status', 'Decided by', 'Comment', ''],
      result.data.map(r => [
        ui.range(r.start_date, r.end_date),
        '<span class="num">' + r.total_days + '</span>',
        ui.escape(r.user_comment || '-'),
        ui.badge(r.status),
        r.reviewer_first_name ? ui.escape(r.reviewer_first_name + ' ' + r.reviewer_last_name) : '-',
        ui.escape(r.reviewer_comment || '-'),
        r.status === 'Pending'
          ? '<button class="btn small danger" onclick="cancelRequest(' + r.id + ')">Cancel</button>'
          : '',
      ]),
      'No leave requests to show.'
    );
  } catch (err) {
    list.className = '';
    list.innerHTML = ui.alert(err.message, 'error');
  }
}

async function cancelRequest(id) {
  try {
    await api.patch('/api/leave/requests/' + id + '/cancel');
    ui.toast('Request cancelled.', 'ok');
    load();
  } catch (err) {
    ui.toast(err.message, 'error');
  }
}

  </script>
</body>
</html>
