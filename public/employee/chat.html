<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR assistant &middot; HR Management System</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/chat.js"></script>
  <script>

const user = requireRole('employee', 'manager', 'admin');
if (user) start();

function start() {
  const main = ui.layout(user, '/employee/chat.html');
  main.innerHTML = ui.head('HR assistant', 'Ask about your leave. Answers come from your own records.') +
    '<div class="card" id="chat"></div>';
  createChat(document.getElementById('chat'), user.role);
}

  </script>
</body>
</html>
