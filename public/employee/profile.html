<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile &middot; HR Management System</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/chat.js"></script>
  <script>

const user = requireRole('employee', 'manager', 'admin');
if (user) start();

async function start() {
  const main = ui.layout(user, '/employee/profile.html');
  main.innerHTML = ui.head('My profile', 'Your details as recorded by HR') +
    '<div class="loading" id="body">Loading...</div>';

  try {
    const me = await api.get('/api/auth/me');
    const m = me.data;
    document.getElementById('body').outerHTML = `
      <div class="card" style="max-width:520px">
        <div class="table-wrap">
          <table>
            <tbody>
              <tr><td>Name</td><td><strong>${ui.escape(m.firstName + ' ' + m.lastName)}</strong></td></tr>
              <tr><td>Email</td><td>${ui.escape(m.email)}</td></tr>
              <tr><td>Company</td><td>${ui.escape(m.companyName)}</td></tr>
              <tr><td>Department</td><td>${ui.escape(m.departmentName || 'Not assigned')}</td></tr>
              <tr><td>Role</td><td><span class="badge role">${ui.escape(m.role)}</span></td></tr>
              <tr><td>Employee number</td><td class="num">${m.employeeId}</td></tr>
            </tbody>
          </table>
        </div>
        <p class="hint">Your name, department and role are managed by your administrator. Ask them if something here is wrong.</p>
      </div>`;
  } catch (err) {
    document.getElementById('body').outerHTML = ui.alert(err.message, 'error');
  }
}

  </script>
</body>
</html>
